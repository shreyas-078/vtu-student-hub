<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2022 Scheme SGPA Calculator</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.png')}}" type="image/x-icon">
  <script src="{{ url_for('static', filename='js/gpa-calci.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
  {% include "_nav.html" %}
  <main>
    <h1>SGPA Calculator</h1>
    <p>Enter your marks out of 100 for each subject. This uses the 2022 scheme credits (20 in total).</p>
    <div class="subjects-container">
      <div class="sub-1">
        <label for="sub1-marks">Subject 1</label>
        <input type="number" id="sub1-marks" min="0" max="100" />
        <p>4 credits</p>
      </div>
      <div class="sub-2">
        <label for="sub2-marks">Subject 2</label>
        <input type="number" id="sub2-marks" min="0" max="100" />
        <p>4 credits</p>
      </div>
      <div class="sub-3">
        <label for="sub3-marks">Subject 3</label>
        <input type="number" id="sub3-marks" min="0" max="100" />
        <p>3 credits</p>
      </div>
      <div class="sub-4">
        <label for="sub4-marks">Subject 4</label>
        <input type="number" id="sub4-marks" min="0" max="100" />
        <p>3 credits</p>
      </div>
      <div class="sub-5">
        <label for="sub5-marks">Subject 5</label>
        <input type="number" id="sub5-marks" min="0" max="100" />
        <p>3 credits</p>
      </div>
      <div class="sub-6">
        <label for="sub6-marks">Subject 6</label>
        <input type="number" id="sub6-marks" min="0" max="100" />
        <p>1 credit</p>
      </div>
      <div class="sub-7">
        <label for="sub7-marks">Subject 7</label>
        <input type="number" id="sub7-marks" min="0" max="100" />
        <p>1 credit</p>
      </div>
      <div class="sub-8">
        <label for="sub8-marks">Subject 8</label>
        <input type="number" id="sub8-marks" min="0" max="100" />
        <p>1 credit</p>
      </div>
      <p class="valid-marks-helper-text invisible" role="alert">Please enter valid marks (0 to 100) for every subject.</p>
      <div class="buttons-container">
        <button class="calculate-sgpa btn" type="button">Calculate</button>
        <button class="reset btn" type="button">Reset</button>
      </div>
    </div>
    <section class="sgpa-display invisible" aria-live="polite">
      <div class="sgpa-display">
        <p class="your-sgpa-text">Your SGPA is: SGPA</p>
      </div>
    </section>
  </main>
</body>

</html>
