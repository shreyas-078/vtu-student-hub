<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|capitalize }} solvers, VTU Student Hub</title>
  <meta name="description" content="Calculators for the VTU first-year {{ title }} syllabus ({{ course }}), each tagged with its course code and module.">
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
  {% from "_catalog.html" import listing %}
  {% include "_nav.html" %}
  <main>
    <h1>{{ title|capitalize }} solvers</h1>
    <p class="lead">Calculators matched to the VTU 2025 scheme syllabus for {{ course }}. Each one shows the formula it uses and the course module it belongs to.</p>
    {{ listing(groups) }}
  </main>
</body>

</html>
