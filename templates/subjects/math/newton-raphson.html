<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton Raphson Solver</title>
  <script src="{{ url_for('static', filename='js/subjects/math/newton-raphson.js') }}" defer></script>
  <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.png')}}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
    {% include "_nav.html" %}

  <h1 id="newton-raphson-heading">Newton Raphson Solver</h1>
  <div class="container">
    <div class="nr-function" id="alignment-fix">
      <label for="function">Enter the function:</label>
      <input type="text" id="function" placeholder="x ** 2" class="right-align">
    </div>
    <div class="nr-initial-approximation" id="alignment-fix">
      <label for="initial-approximation">Enter initial Approximation:</label>
      <input type="text" id="initial-approximation" class="right-align">
    </div>
    <div class="nr-iterations" id="alignment-fix">
      <label for="iterations">Enter Number of Iterations:</label>
      <input type="text" id="iterations" class="right-align">
    </div>
    <div class="control-buttons buttons">
      <button type="button" class="calculate-btn btn">Calculate</button>
      <button type="button" class="reset-btn btn">Reset</button>
      <p tabindex="0">How to use</p>
    </div>
    <div class="ans-para">
      <p id="answer-text"></p>
    </div>
  </div>
</body>

</html>
