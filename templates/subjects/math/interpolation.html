<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interpolation Solver</title>
  <script src="{{ url_for('static', filename='js/subjects/math/interpolation.js') }}" defer></script>
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
    {% include "_nav.html" %}
  <h1 class="interpolation-heading">Interpolation Solver</h1>
  <section class="interpolation">
    <div class="inter-num-data-points">
      <label for="inter-num-data-points">Enter Number of Data Points</label>
      <input type="number" id="inter-num-data-points">
    </div>
    <button type="button" id="btn-inter-apply-data-points" class="btn">Apply</button>
    <div class="inter-data-points invisible">
    </div>
    <div class="point-to-interpolate">
      <label for="pt-inter">Enter the Point to interpolate at</label>
      <input type="number" id="pt-inter">
    </div>
    <div class="button-controls">
      <button type="button" class="btn btn-calculate-inter">Calculate</button>
        <button class="btn btn-reset" type="button">Reset</button>
    </div>
  </section>
  <div class="ans-para">
    <p class="ans-text"></p>
  </div>
</body>

</html>
