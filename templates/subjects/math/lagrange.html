<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagrange Interpolation Solver</title>
  <script src="{{ url_for('static', filename='js/subjects/math/lagrange.js') }}" defer></script>
  <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.png')}}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
    {% include "_nav.html" %}
  <h1 class="lagrange-heading">Lagrange Interpolation Solver</h1>
  <div id="lagrange-num-data-points">
    <label for="num-data-pts-input">Enter Number of Data Points</label>
    <input type="text" id="num-data-pts-input" placeholder="5">
  </div>
  <div class="buttons">
    <button id="apply-num-data-pts" class="btn" type="button">Apply</button>
  </div>
  <section class="lagrange-main invisible">
    <div class="data-pts"></div>
    <div class="target-x">
      <label for="target-x-label"> Enter Point to Find Value At </label>
      <input type="number" class="target-x-input">
    </div>
    <button class="btn calculate-btn">Calculate</button>
  </section>
  <div class="buttons">
        <button class="btn reset-btn" type="button">Reset</button>
    </div>
  <div class="ans-para">
    <p class="ans-text"></p>
  </div>
</body>

</html>
