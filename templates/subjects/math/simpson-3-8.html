<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpson's 3/8th Rule Solver</title>
  <script src="{{ url_for('static', filename='js/subjects/math/simpson-3-8.js') }}" defer></script>
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>

<body>
    {% include "_nav.html" %}
  <h1 id="simpson-3-8-heading">Simpson's 3/8th Rule Solver</h1>
  <div class="container">
    <div class="s38-function" id="alignment-fix">
      <label for="function">Enter the function :</label>
      <input type="text" id="function" placeholder="1/(1+x**2)" class="right-align">
    </div>
    <div class="s38-lower-limit" id="alignment-fix">
      <label for="lower-limit">Enter Lower Limit of Integration : </label>
      <input type="number" id="lower-limit" class="right-align">
    </div>
    <div class="s38-upper-limit-value" id="alignment-fix">
      <label for="upper-limit-value">Enter Upper Limit of Integration : </label>
      <input type="number" id="upper-limit-value" class="right-align">
    </div>
    <div class="s38-sub-intervals" id="alignment-fix">
      <label for="sub-intervals">Enter Number of Sub-Intervals :</label>
      <input type="number" id="sub-intervals" class="right-align">
    </div>
    <div class="control-buttons buttons">
      <button type="button" class="calculate-btn btn">Calculate</button>
      <button type="button" class="reset-btn btn">Reset</button>
      <p tabindex="0">How to use</p>
    </div>
    <div class="ans-para">
      <p class="ans-text"></p>
    </div>
  </div>

</body>

</html>
